<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#2F6FCF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">

<title>Nestling Baby Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* layout idea: soft sky-and-blush nursery by day, navy-and-rose low-glare by night; sticky header + top tabs; big thumb buttons */
  --sky-50:#EEF6FF; --sky-100:#DCEBFF; --sky-200:#BCD7FA; --sky-500:#2F6FCF; --sky-700:#1B4A94;
  --pink-50:#FFF1F6; --pink-100:#FFDCE8; --pink-200:#FFBCD2; --pink-500:#D93A73; --pink-700:#9E2152;
  --ink:#21304D; --muted:#5F6E8C; --line:#E3EAF6; --card:#FFFFFF; --surface:#FFFFFF; --page:#F6F9FF; --topbg:rgba(246,249,255,.92);
  --ok:#23805A; --ok-bg:#E3F6EC; --warn:#9A6200; --warn-bg:#FFF0D2; --bad:#B53030; --bad-bg:#FFE3E3; --info-bg:#E4EEFF;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:20px; --shadow:0 6px 20px rgba(47,111,207,.10); --deco:.9;
  color-scheme:light;
}
html[data-mode="night"]{
  --sky-50:#14204A; --sky-100:#1B2A5C; --sky-200:#2E4180; --sky-500:#B5384F; --sky-700:#F6B9C4;
  --pink-50:#2A1830; --pink-100:#3A1E3C; --pink-200:#6A2E4A; --pink-500:#D9556F; --pink-700:#FFB5C2;
  --ink:#F3D5D9; --muted:#9AA6CC; --line:#25335F; --card:#111B3A; --surface:#16224A; --page:#0A1128; --topbg:rgba(10,17,40,.94);
  --ok:#7FD6AE; --ok-bg:#12342A; --warn:#F2C26B; --warn-bg:#3B2E10; --bad:#FF9C9C; --bad-bg:#431C22; --info-bg:#1C2A5C;
  --shadow:0 6px 20px rgba(0,0,0,.35); --deco:.12; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--sky-500);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink)}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(1200px 500px at 90% -10%,var(--pink-100),transparent 60%),radial-gradient(900px 500px at -10% 0%,var(--sky-100),transparent 60%),var(--page)}
.sky svg{position:absolute;opacity:var(--deco)}
.cloud1{top:90px;left:-30px;width:150px;animation:drift 38s ease-in-out infinite alternate}
.cloud2{top:300px;right:-40px;width:190px;animation:drift 46s ease-in-out infinite alternate-reverse}
.star{width:18px;animation:twinkle 4s ease-in-out infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(40px)}}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.sky svg{animation:none!important}}
#app{position:relative;z-index:1;min-height:100%;padding-bottom:110px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:20;background:var(--topbg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 6px}
.who{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;min-width:0}
.who b{font-family:var(--display);font-size:22px;display:block;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.who small{color:var(--muted);font-weight:600;font-size:13px}
.avatar{display:grid;place-items:center;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--sky-100),var(--pink-100));border:3px solid var(--surface);box-shadow:0 0 0 2px var(--pink-200);flex:none;line-height:1}
.avatar img{width:100%;height:100%;object-fit:cover}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--sky-700);padding:0}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:0 0 6px}
.tab{position:relative;border:0;background:transparent;border-radius:14px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{background:var(--sky-500);color:#fff;box-shadow:0 4px 12px rgba(47,111,207,.35)}
.tab[data-v="rem"][aria-selected="true"]{background:var(--pink-500);box-shadow:0 4px 12px rgba(217,58,115,.35)}
.tab .dot{position:absolute;top:4px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--pink-500);border:2px solid var(--surface)}
.subbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 0 8px;flex-wrap:wrap}
.asme{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;color:var(--sky-700)}
.view{padding:16px 0 0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:21px;margin-bottom:4px}
.card h3{font-size:17px}
.sub{color:var(--muted);font-size:14px;margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{border:0;border-radius:16px;padding:12px 18px;font-weight:800;background:var(--sky-500);color:#fff;min-height:48px}
.btn.pink{background:var(--pink-500)}
.btn.ghost{background:var(--surface);color:var(--sky-700);border:1.5px solid var(--sky-200)}
.btn.soft{background:var(--sky-50);color:var(--sky-700)}
.btn.small{min-height:38px;padding:7px 12px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn.danger{background:var(--bad);color:#fff}
.link{background:none;border:0;color:var(--sky-700);font-weight:700;text-decoration:underline;padding:8px 4px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:700;min-height:42px}
.chip[aria-pressed="true"]{background:var(--sky-500);border-color:var(--sky-500);color:#fff}
.chip.pk[aria-pressed="true"]{background:var(--pink-500);border-color:var(--pink-500)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
label.f{display:block;font-weight:800;font-size:14px;margin-bottom:6px}
.inp{width:100%;border:1.5px solid var(--sky-200);border-radius:14px;padding:11px 13px;background:var(--surface);min-height:48px}
.field{display:flex;flex-direction:column;gap:2px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--sky-700)}
.pill.none{background:var(--sky-50);color:var(--muted)}
.by{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.by.b0{background:var(--info-bg);color:var(--sky-700)} .by.b1{background:var(--pink-100);color:var(--pink-700)}
.empty{text-align:center;color:var(--muted);padding:14px 8px;font-weight:600}
.empty span{display:block;font-size:30px;margin-bottom:2px}
.big{font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stat{background:var(--sky-50);border-radius:16px;padding:12px}
.stat.pk{background:var(--pink-50)}
.stat small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(120deg,var(--sky-100),var(--pink-100));border:0}
.hero .big{font-size:30px}
.hero p{margin:2px 0 0;font-weight:700}
.logbtn{border:0;border-radius:24px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:var(--display);font-size:22px;font-weight:600;color:#fff;box-shadow:0 8px 18px rgba(47,111,207,.22);transition:transform .12s}
.logbtn:active{transform:scale(.97)}
.logbtn.b{background:linear-gradient(160deg,#5A9BEA,var(--sky-500))}
.logbtn.p{background:linear-gradient(160deg,#F27AA3,var(--pink-500));box-shadow:0 8px 18px rgba(217,58,115,.22)}
.logbtn.m{background:linear-gradient(160deg,#9AB8E8,#6C8FD4)}
html[data-mode="night"] .logbtn.b{background:linear-gradient(160deg,#4B5FA8,#2E3F86)}
html[data-mode="night"] .logbtn.p{background:linear-gradient(160deg,#D9556F,#A13049)}
html[data-mode="night"] .logbtn.m{background:linear-gradient(160deg,#5A4A98,#3A2F78)}
.logbtn svg{width:36px;height:36px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logbtn small{font-family:var(--body);font-weight:700;font-size:13px;opacity:.92}
.sleepbtn{width:210px;height:210px;border-radius:50%;margin:6px auto;border:0;color:#fff;font-family:var(--display);font-size:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:radial-gradient(circle at 30% 25%,#7DB1F5,var(--sky-500) 70%);box-shadow:0 0 0 12px var(--sky-100),0 16px 30px rgba(47,111,207,.3)}
.sleepbtn.on{background:radial-gradient(circle at 30% 25%,#F9A1BF,var(--pink-500) 70%);box-shadow:0 0 0 12px var(--pink-100),0 16px 30px rgba(217,58,115,.3)}
.sleepbtn .big{font-size:38px;color:#fff}
html[data-mode="night"] .btn{min-height:58px;font-size:18px}
html[data-mode="night"] .btn.small{min-height:46px;font-size:16px}
html[data-mode="night"] .chip{min-height:52px;font-size:17px;padding:10px 16px}
html[data-mode="night"] .logbtn{min-height:150px;font-size:26px}
html[data-mode="night"] .inp{min-height:56px;font-size:18px}
html[data-mode="night"] .tab{font-size:13px;padding:10px 2px 8px}
html[data-mode="night"] .sleepbtn{width:250px;height:250px}
.hist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.hist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.hist li:first-child{border-top:0}
.hist time{font-weight:800;min-width:74px;font-variant-numeric:tabular-nums}
.hist .d{flex:1}
.hist .x{border:0;background:none;color:var(--muted);width:36px;height:36px;border-radius:50%;font-size:20px}
.hist .day{display:block;font-size:12px;color:var(--muted);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:10px}
.bars div.c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars i{display:block;width:100%;max-width:34px;border-radius:10px 10px 4px 4px;background:var(--sky-200)}
.bars .today i{background:var(--sky-500)} .bars.pk i{background:var(--pink-200)} .bars.pk .today i{background:var(--pink-500)}
.bars b{font-size:12px;font-variant-numeric:tabular-nums} .bars span{font-size:12px;color:var(--muted);font-weight:700}
.tip{display:flex;gap:12px;align-items:flex-start}
.tip .ic{font-size:26px;line-height:1}
.tip p{margin:0}
.ob{padding-top:calc(24px + env(safe-area-inset-top))}
.ob .brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:24px;color:var(--sky-700)}
.ob h1{font-size:34px;margin:14px 0 6px}
.avpick{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px}
.emojis button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;font-size:24px;aspect-ratio:1;min-height:40px;padding:0}
.emojis button[aria-pressed="true"]{border-color:var(--pink-500);background:var(--pink-50);box-shadow:0 0 0 2px var(--pink-200)}
.err{color:var(--bad);font-weight:700;font-size:14px;margin:6px 0 0}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:999px;background:#C9D3E6;transition:.2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+span{background:var(--pink-500)} .sw input:checked+span::after{transform:translateX(22px)}
.sw input:focus-visible+span{outline:3px solid var(--sky-500);outline-offset:2px}
.rem{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px dashed var(--line)}
.rem:first-of-type{border-top:0}
.rem .t{flex:1;min-width:0}
.rem .t b{display:block}
.xbtn{border:0;background:none;font-size:22px;color:var(--muted);width:36px;height:36px;border-radius:50%}
#toasts{position:fixed;left:0;right:0;top:calc(150px + env(safe-area-inset-top));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;padding:0 12px;pointer-events:none}
.toast{pointer-events:auto;width:100%;max-width:520px;background:var(--surface);border:2px solid var(--pink-200);border-left:8px solid var(--pink-500);border-radius:18px;padding:12px 14px;box-shadow:0 14px 30px rgba(33,48,77,.25);animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.toast b{font-family:var(--display);font-size:18px}
.toast p{margin:2px 0 8px;color:var(--muted);font-weight:600}
#snack{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--page);border-radius:999px;padding:10px 18px;font-weight:700;z-index:80;max-width:90vw;text-align:center}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:30;width:62px;height:62px;border-radius:50%;border:0;background:linear-gradient(150deg,#F27AA3,var(--pink-500));color:#fff;display:grid;place-items:center;box-shadow:0 10px 22px rgba(217,58,115,.4)}
.fab svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scrim{position:fixed;inset:0;background:rgba(10,17,40,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90%;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-size:24px;margin-bottom:4px}
.sheet h3{margin:16px 0 6px}
.micbig{width:96px;height:96px;border-radius:50%;border:0;background:linear-gradient(150deg,#F27AA3,var(--pink-500));display:grid;place-items:center;margin:8px auto;box-shadow:0 0 0 10px var(--pink-100)}
.micbig svg{width:40px;height:40px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.note{background:var(--info-bg);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:600;color:var(--sky-700)}
.note.pk{background:var(--pink-50);color:var(--pink-700)}
.hand{background:var(--pink-50);border:1.5px solid var(--pink-200);border-left:8px solid var(--pink-500)}
.redflag{background:var(--bad-bg);border:2px solid var(--bad);color:var(--ink)}
.redflag h2{color:var(--bad)}
.calm{display:flex;gap:12px;align-items:flex-start;background:var(--sky-50);border-color:var(--sky-200)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:28px;letter-spacing:.08em;font-weight:800;text-align:center;background:var(--sky-50);border-radius:14px;padding:12px;user-select:all}
.moods{display:flex;gap:8px}
.moods button{flex:1;font-size:28px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;min-height:54px}
.moods button[aria-pressed="true"]{border-color:var(--pink-500);background:var(--pink-50);box-shadow:0 0 0 2px var(--pink-200)}
details summary{cursor:pointer;font-weight:800;color:var(--sky-700);padding:6px 0}
.foot{text-align:center;color:var(--muted);font-size:13px;font-weight:600;padding:18px 0 0}
.visually{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mini{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.mini th,.mini td{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line)}
.mini th{color:var(--muted);font-size:12px}
/* doctor report (always paper-white) */
.reportwrap{position:fixed;inset:0;z-index:70;background:#E9EEF8;overflow:auto;padding:12px}
.rep{max-width:780px;margin:0 auto;background:#fff;color:#16213A;border-radius:14px;padding:22px;font-size:14px;line-height:1.4;font-family:var(--body)}
.rep h1{font-size:26px;margin:0 0 2px;color:#16213A} .rep h3{font-size:16px;margin:16px 0 6px;color:#1B4A94;font-family:var(--display)}
.rep table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums} .rep th,.rep td{border-bottom:1px solid #DDE5F3;padding:5px 4px;text-align:left} .rep th{font-size:12px;color:#5F6E8C}
.rep td:not(:first-child),.rep th{white-space:nowrap} .rep{overflow-x:auto}
.rep .tot td{font-weight:800;background:#F1F6FF}
.rep textarea{width:100%;min-height:70px;border:1.5px solid #BCD7FA;border-radius:10px;padding:8px;color:#16213A;background:#fff}
.reptools{max-width:780px;margin:0 auto 10px;display:flex;gap:8px;flex-wrap:wrap}
@media print{body *{visibility:hidden}.rep,.rep *{visibility:visible}.reportwrap{position:static;background:#fff;padding:0}.rep{position:absolute;left:0;top:0;width:100%;border-radius:0}.noprint{display:none!important}}
@media (min-width:640px){.logbtn{min-height:140px}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <svg class="cloud1" viewBox="0 0 160 70"><path d="M30 60a22 22 0 0 1 2-44 30 30 0 0 1 58-6 26 26 0 0 1 40 22 20 20 0 0 1-4 28z" fill="#fff" opacity=".85"/></svg>
  <svg class="cloud2" viewBox="0 0 160 70"><path d="M30 60a22 22 0 0 1 2-44 30 30 0 0 1 58-6 26 26 0 0 1 40 22 20 20 0 0 1-4 28z" fill="#fff" opacity=".8"/></svg>
  <svg class="star" style="top:150px;right:14%" viewBox="0 0 24 24"><path d="M12 2l2.6 6.4L21 9l-5 4.4L17.5 20 12 16.5 6.5 20 8 13.4 3 9l6.4-.6z" fill="#FFBCD2"/></svg>
  <svg class="star" style="top:420px;left:6%;animation-delay:1.2s" viewBox="0 0 24 24"><path d="M12 2l2.6 6.4L21 9l-5 4.4L17.5 20 12 16.5 6.5 20 8 13.4 3 9l6.4-.6z" fill="#BCD7FA"/></svg>
  <svg class="star" style="top:640px;right:8%;animation-delay:2.2s" viewBox="0 0 24 24"><path d="M12 2l2.6 6.4L21 9l-5 4.4L17.5 20 12 16.5 6.5 20 8 13.4 3 9l6.4-.6z" fill="#BCD7FA"/></svg>
</div>
<div id="app"><div class="wrap"><p class="empty"><span>🍼</span>Warming the bottle…</p></div></div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="snackhost" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const now = () => Date.now();

function buildLearn(lastT, gaps, days, label) {

}

  const f = LG('feed').sort((a, b) => a.t - b.t), gaps = []; for (let i = 1; i < f.length; i++) { const g = f[i].t - f[i - 1].t; if (g >= 20 * MIN && g <= 8 * HR) gaps.push(g); }
  return buildLearn(f.length ? f[f.length - 1].t : null, gaps, f.length ? Math.floor((now() - f[0].t) / DAY) : 0, 'feeds');
}
function learnNap() {

/* ================= doctor report ================= */
function reportData() {
  const b = cur(), rows = []; const L = LG();
  for (let i = 6; i >= 0; i--) { const a = sod() - i * DAY, z = a + DAY, day = L.filter(l => l.t >= a && l.t < z), fd = day.filter(l => l.kind === 'feed');
    rows.push({label:new Date(a).toLocaleDateString([], {weekday:'short', month:'numeric', day:'numeric'}) + (i === 0 ? ' *' : ''), feeds:fd.length, breastMin:fd.filter(l => l.sub === 'breast').reduce((n, l) => n + (l.dur || 0), 0), bottleMl:fd.filter(l => l.sub === 'bottle').reduce((n, l) => n + (l.ml || 0), 0),
      wet:day.filter(l => l.kind === 'diaper' && l.type !== 'poop').length, dirty:day.filter(l => l.kind === 'diaper' && l.type !== 'pee').length, sleepH:sleepMsIn(a, z, L) / HR, naps:L.filter(l => l.kind === 'sleep' && l.t >= a && l.t < z).length}); }
  const since = sod() - 6 * DAY;
  return {b, rows, meds:L.filter(l => l.kind === 'med' && l.t >= since).sort((x, y) => x.t - y.t), temps:L.filter(l => l.kind === 'temp' && l.t >= since).sort((x, y) => x.t - y.t), growth:growthList(), colors:L.filter(l => l.kind === 'diaper' && l.color && l.t >= since)};
}

  return `<h1>${esc(R.b.name || 'Baby')}: 7-day summary</h1><div style="color:#5F6E8C">${d != null ? esc(ageText(d)) + ' · born ' + fmtD(new Date(R.b.dob + 'T00:00:00')) + ' · ' : ''}Prepared ${fmtD(now())}</div>

    ${R.rows.map(r => `<tr><td>${esc(r.label)}</td><td>${r.feeds}</td><td>${r.breastMin}</td><td>${vol(r.bottleMl)}</td><td>${r.wet}</td><td>${r.dirty}</td><td>${r.sleepH.toFixed(1)} h</td><td>${r.naps}</td></tr>`).join('')}

      ${UI.remErr ? `<p class="err" role="alert">${esc(UI.remErr)}</p>` : ''}
      <div class="row" style="margin-top:16px"><button class="btn pink" style="flex:1" data-act="saveRem" type="button">Save reminder</button><button class="btn ghost" data-act="closeSheet" type="button">Cancel</button></div>`; }
  if (sh.type === 'medConfirm') { const r = S.reminders.find(x => x.id === sh.rid), l = S.logs.find(x => x.id === sh.lastId), who = l && ((l.by && cgName(l.by)) || l.byN) || 'Someone';
    inner = `<h2>Hold on, check first</h2><p style="margin:6px 0 12px"><b>${esc(who)}</b> gave <b>${esc(r ? r.label : 'this medicine')}</b> ${l ? ago(now() - l.t) + ' (at ' + fmtT(l.t) + ')' : 'recently'}. The label says to wait ${r ? r.minGapH : ''} hours between doses.</p>
      <div class="grid2"><button class="btn" data-act="closeSheet" type="button">Don't log it</button><button class="btn ghost" data-act="medForce" data-id="${sh.rid}" type="button">Log anyway</button></div>`; }
  if (sh.type === 'whoami') inner = `<h2>Who is logging?</h2><p class="sub" style="margin-bottom:12px">Every entry shows who logged it. Switch any time from the top of the screen, even on a shared phone.</p>${cgPicker(true)}<button class="btn block" style="margin-top:14px" data-act="whoDone" type="button">${LOC.me ? 'Continue' : 'Skip for now'}</button>`;
  if (sh.type === 'settings') inner = `<h2>Settings</h2>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px"><button class="btn soft" style="text-align:left" data-act="editProfile" type="button">Baby details</button><button class="btn soft" style="text-align:left" data-act="newBaby" type="button">Add another baby (twins)</button><button class="btn soft" style="text-align:left" data-act="shareSheet" type="button">Caregivers and sharing${FAM ? ' · live' : ''}</button></div>
    <h3>Display</h3><div class="chips" role="group" aria-label="Display mode">${[['auto', 'Auto (night after 7 p.m.)'], ['night', 'Night'], ['day', 'Day']].map(([v, t]) => `<button class="chip" data-act="setTheme" data-v="${v}" aria-pressed="${LOC.theme === v}" type="button">${t}</button>`).join('')}</div>
    <h3>Units</h3><div class="chips" role="group" aria-label="Units"><button class="chip" data-act="setUnits" data-v="us" aria-pressed="${S.units === 'us'}" type="button">oz, lb, °F</button><button class="chip" data-act="setUnits" data-v="metric" aria-pressed="${S.units === 'metric'}" type="button">ml, kg, °C</button></div>
    <button class="btn ghost block" style="margin-top:16px" data-act="closeSheet" type="button">Close</button>`;
  if (sh.type === 'share') inner = `<h2>Caregivers and sharing</h2><h3>Who uses this phone</h3>${cgPicker(false)}
    <h3>Share with another phone</h3>${FAM ? `<p class="sub" style="margin-bottom:8px">Live sync is on. Give this code to the other parent.</p><div class="code">${esc(FAM.code)}</div>
      <div class="row" style="margin-top:8px"><button class="btn small" data-act="copyCode" type="button">Copy code</button><button class="btn small ghost" data-act="leaveFam" type="button">Stop sharing on this phone</button></div>
      <div class="note" style="margin-top:10px"><b>On the other phone:</b> open Nestling, tap the gear, choose Caregivers and sharing, then Join with a code. They also need access to this page, shared with edit rights from claude.ai.</div>`
      : DBNS ? `<p class="sub" style="margin-bottom:10px">Create a family code on one phone. The other parent enters it on theirs, and both phones see the same entries, live, with names.</p><button class="btn block" data-act="famCreate" type="button">Create a family code</button>
      <p class="sub" style="margin:14px 0 6px"><b>Already have a code?</b></p><div class="row"><input class="inp" id="joinCode" placeholder="ABCDE-FGH23" style="flex:1;text-transform:uppercase" aria-label="Family code" autocomplete="off"><button class="btn soft" data-act="famJoin" type="button">Join</button></div>
      <div class="note" style="margin-top:10px">The code works like a shared key. Share it only with people you trust, and share this page only with your family.</div>`
      : `<div class="note pk">Live sync between two phones is not turned on in this version, so each phone keeps its own entries. To share one phone, switch "Logging as" at the top before each entry.</div>`}
    <button class="btn ghost block" style="margin-top:16px" data-act="closeSheet" type="button">Close</button>`;
  host.innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="Dialog">${inner}</div></div>`;
}
function renderToasts() {
  const host = $('#toasts'); if (!host) return;
  host.innerHTML = UI.toasts.slice(-3).map(a => { const r = S.reminders.find(x => x.id === a.rid); return `<div class="toast"><b>${esc(a.title)}</b><p>${esc(a.body)}</p>
    <div class="row"><button class="btn small pink" data-act="toastLog" data-id="${a.id}" type="button">${r && r.type === 'med' ? 'Mark given' : 'Open'}</button><button class="btn small ghost" data-act="toastSnooze" data-id="${a.id}" type="button">Snooze 10 min</button><button class="btn small ghost" data-act="toastClose" data-id="${a.id}" type="button">Dismiss</button></div></div>`; }).join('');
}
function tick() {
  const t = now();
  document.querySelectorAll('[data-since]').forEach(e => e.textContent = durText(t - Number(e.dataset.since)));
  document.querySelectorAll('[data-until]').forEach(e => { const u = Number(e.dataset.until); e.textContent = u <= t ? 'now' : 'in ' + durText(u - t); });
  document.querySelectorAll('[data-clock]').forEach(e => e.textContent = clockText(t - Number(e.dataset.clock)));
}
function loadPhoto(file) {
  if (!file) return; const fr = new FileReader();
  fr.onload = () => { const img = new Image(); img.onload = () => { const c = document.createElement('canvas'), n = 180; c.width = c.height = n; const x = c.getContext('2d'), m = Math.min(img.width, img.height); x.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, n, n); UI.draft.avatar = {type:'photo', value:c.toDataURL('image/jpeg', .82)}; render(); }; img.src = fr.result; };
  fr.readAsDataURL(file);
}

/* ================= events ================= */
document.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.d && UI.draft) UI.draft[t.dataset.d] = t.value; if (t.id === 'brandOther' && UI.setup) UI.setup.brand = t.value; if (t.id === 'repNote') { S.reportNote = t.value; save(); } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'photoIn') return loadPhoto(t.files[0]);
  if (t.dataset.bind === 'when') UI.when = Number(t.value);
  if (t.dataset.bind === 'toggleRem') { const r = S.reminders.find(x => x.id === t.dataset.id); if (r) { r.on = t.checked; if (r.mode === 'interval') r.since = now(); save(); render(); } }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'voiceIn') { e.preventDefault(); act('voiceRun'); } if (e.key === 'Escape' && UI.sheet) act('closeSheet'); });
document.addEventListener('click', e => { unlockAudio(); const b = e.target.closest('[data-act]'); if (!b) return; if (b.dataset.act === 'scrim' && e.target !== b) return; act(b.dataset.act, b); });
function addCaregiver(name) { name = name.trim().slice(0, 20); if (!name) return; if (S.caregivers.some(c => c.name.toLowerCase() === name.toLowerCase())) { const c = S.caregivers.find(x => x.name.toLowerCase() === name.toLowerCase()); LOC.me = c.id; } else { const c = {id:uid(), name}; S.caregivers.push(c); LOC.me = c.id; } LOC.askedWho = true; save(); }
function act(a, b) {
  const v = b && b.dataset ? b.dataset.v : null, P = S.feedPrefs;
  switch (a) {
    case 'unit': { const D = UI.draft, w = parseFloat(D.w), h = parseFloat(D.hgt); if (v === 'us' && S.units !== 'us') { if (w) D.w = (w * 2.20462).toFixed(1); if (h) D.hgt = (h / 2.54).toFixed(1); } if (v === 'metric' && S.units === 'us') { if (w) D.w = (w / 2.20462).toFixed(2); if (h) D.hgt = (h * 2.54).toFixed(1); } S.units = v; save(); return render(); }
    case 'gender': UI.draft.gender = v; return render();
    case 'emoji': UI.draft.avatar = {type:'emoji', value:v}; return render();
    case 'clearAvatar': UI.draft.avatar = null; return render();
    case 'pickPhoto': return $('#photoIn').click();
    case 'saveProfile': { const D = UI.draft; if (!D.name.trim()) { D.err = 'Add a name, or choose Skip for now.'; return render(); } const w = parseFloat(D.w), h = parseFloat(D.hgt);
      const data = {name:D.name.trim(), gender:D.gender, dob:D.dob, avatar:D.avatar, weightKg:w ? (S.units === 'us' ? w / 2.20462 : w) : null, heightCm:h ? (S.units === 'us' ? h * 2.54 : h) : null, blank:false};
      if (D.mode === 'new') { const nb = Object.assign({id:uid(), sleepActive:null, breastActive:null}, data); S.babies.push(nb); LOC.babyId = nb.id; UI.both = false; }
      else if (D.mode === 'edit' && cur()) Object.assign(cur(), data); else { S.babies = [Object.assign({id:uid(), sleepActive:null, breastActive:null}, data)]; S.skipped = false; LOC.babyId = S.babies[0].id; }
      UI.draft = null; save(); return render(); }
    case 'skipProfile': S.skipped = true; S.babies = [{id:uid(), name:'', gender:'', dob:'', avatar:null, weightKg:null, heightCm:null, sleepActive:null, breastActive:null, blank:true}]; LOC.babyId = S.babies[0].id; UI.draft = null; save(); return render();
    case 'editProfile': UI.sheet = null; UI.draft = draftFrom(cur(), 'edit'); return render();
    case 'newBaby': UI.sheet = null; UI.draft = draftFrom(null, 'new'); return render();
    case 'cancelProfile': UI.draft = null; return render();
    case 'mute': LOC.muted = !LOC.muted; saveLocal(); return render();
    case 'theme': LOC.theme = LOC.theme === 'auto' ? 'night' : LOC.theme === 'night' ? 'day' : 'auto'; saveLocal(); snack('Display: ' + (LOC.theme === 'auto' ? 'Auto (night after 7 p.m.)' : LOC.theme)); return render();
    case 'setTheme': LOC.theme = v; saveLocal(); return render();
    case 'setUnits': S.units = v; save(); return render();
    case 'settings': UI.sheet = {type:'settings'}; return renderSheet();
    case 'shareSheet': UI.sheet = {type:'share'}; return renderSheet();
    case 'tab': UI.tab = v; UI.when = 0; return render();
    case 'pickBaby': if (b.dataset.id === 'both') UI.both = true; else { UI.both = false; LOC.babyId = b.dataset.id; saveLocal(); } return render();
    case 'del': removeLog(b.dataset.id); return render();
    case 'seen': { const me = meC(); if (me) { LOC.seen[me.id] = now(); saveLocal(); } return render(); }
    /* caregivers + sharing */
    case 'whoami': UI.sheet = {type:'whoami'}; return renderSheet();
    case 'setMe': LOC.me = b.dataset.id; LOC.askedWho = true; if (!LOC.seen[LOC.me]) LOC.seen[LOC.me] = now(); saveLocal(); return render();
    case 'addCg': addCaregiver(v); return render();
    case 'addCgName': { const i = $('#cgName'); if (i && i.value.trim()) { addCaregiver(i.value); return render(); } return; }
    case 'delCg': S.caregivers = S.caregivers.filter(c => c.id !== b.dataset.id); if (LOC.me === b.dataset.id) LOC.me = null; save(); return render();
    case 'whoDone': LOC.askedWho = true; if (LOC.me && !LOC.seen[LOC.me]) LOC.seen[LOC.me] = now(); saveLocal(); UI.sheet = null; return render();
    case 'famCreate': return famCreate();
    case 'famJoin': return famJoin(($('#joinCode') || {}).value || '');
    case 'leaveFam': return famLeave();
    case 'copyCode': try { navigator.clipboard.writeText(FAM.code).then(() => snack('Code copied.'), () => snack('Select the code and copy it.')); } catch (e) { snack('Select the code and copy it.'); } return;
    /* feed */
    case 'setup': UI.setup[b.dataset.k] = b.dataset.k === 'intervalH' ? Number(v) : v; if (b.dataset.k === 'type' && v === 'breast') UI.setup.other = false; return render();
    case 'brand': if (v === 'Other') { UI.setup.other = true; UI.setup.brand = ''; } else { UI.setup.other = false; UI.setup.brand = v; } return render();
    case 'saveFeedSetup': { const Q = UI.setup; S.feedPrefs = {done:true, type:Q.type, brand:Q.type === 'breast' ? '' : (Q.brand || ''), bottleMl:Number(Q.bottleMl) || 90, intervalH:Number(Q.intervalH)};
      const r = S.reminders.find(x => x.id === 'r-feed'); if (r) { if (Q.intervalH > 0) { r.hours = Q.intervalH; r.on = true; r.since = now(); } else r.on = false; }
      UI.feedMode = null; UI.setup = null; save(); return render(); }
    case 'skipFeedSetup': S.feedPrefs.done = true; UI.setup = null; save(); return render();
    case 'editFeedSetup': S.feedPrefs.done = false; UI.setup = Object.assign({}, S.feedPrefs, {other:!!S.feedPrefs.brand && !FORMULAS.includes(S.feedPrefs.brand)}); return render();
    case 'feedMode': UI.feedMode = v; return render();
    case 'milk': UI.milk = v; return render();
    case 'breastStart': cur().breastActive = {side:b.dataset.side, start:now()}; save(); return render();
    case 'breastSwitch': finishBreast(true); return render();
    case 'breastDone': finishBreast(false); return render();
    case 'breastQuick': addLog({kind:'feed', sub:'breast', side:nextSide(), dur:Number(b.dataset.m)}); return render();
    case 'bottle': addLog({kind:'feed', sub:'bottle', ml:Number(b.dataset.ml), milk:UI.milk, brand:UI.milk === 'formula' ? P.brand : ''}, {both:true}); return render();
    case 'bottleCustom': { const n = parseFloat($('#customMl').value); if (!n) return; addLog({kind:'feed', sub:'bottle', ml:S.units === 'us' ? Math.round(n * 29.5735) : Math.round(n), milk:UI.milk, brand:UI.milk === 'formula' ? P.brand : ''}, {both:true}); return render(); }
    case 'pumpWhere': UI.pumpWhere = v; return render();
    case 'pump': S.stash.push({id:uid(), ml:Number(b.dataset.ml), t:whenTs(), where:UI.pumpWhere, by:LOC.me || null, byN:meC() ? meC().name : ''}); UI.when = 0; save(); snack('Added to the ' + UI.pumpWhere + '.'); return render();
    case 'useBag': { const x = S.stash.find(s => s.id === b.dataset.id); if (x) { x.used = true; addLog({kind:'feed', sub:'bottle', ml:x.ml, milk:'milk', brand:''}); snack('Logged a bottle of pumped milk.'); } return render(); }
    case 'tossBag': S.stash = S.stash.filter(s => s.id !== b.dataset.id); save(); return render();
    /* diaper */
    case 'diaper': { const l = addLog({kind:'diaper', type:v}, {both:true}); UI.sheet = {type:'diaperDetail', id:l.id}; return render(); }
    case 'diaperColor': { const l = S.logs.find(x => x.id === UI.sheet.id); if (l) { l.color = v; touchLog(l); } return renderSheet(); }
    /* sleep */
    case 'sleepToggle': { const ts = whenTs(); UI.when = 0; if (allAsleep()) endSleep(ts); else if (asleepAny()) { startSleep(ts); } else startSleep(ts); return render(); }
    case 'pastSleep': { const s = new Date($('#ps-s').value).getTime(), en = new Date($('#ps-e').value).getTime(); if (!s || !en || en <= s) return snack('Pick a wake time after the fall-asleep time.'); targetIds(true).forEach(id => commitLog({id:uid(), kind:'sleep', b:id, t:s, end:en, by:LOC.me || null, byN:meC() ? meC().name : ''})); return render(); }
    /* reminders */
    case 'addRemSheet': UI.sheet = {type:'addRem'}; UI.remType = 'med'; UI.remTimes = ['09:00']; UI.remHours = 3; UI.remGap = 0; UI.remErr = ''; UI.remName = ''; UI.remDose = ''; return renderSheet();
    case 'remType': UI.remType = v; UI.remErr = ''; return renderSheet();
    case 'remHours': UI.remHours = Number(v); return renderSheet();
    case 'remGap': UI.remGap = Number(v); return renderSheet();
    case 'addTime': { const t = $('#rt').value; if (t && !UI.remTimes.includes(t) && UI.remTimes.length < 6) UI.remTimes.push(t); UI.remTimes.sort(); return renderSheet(); }
    case 'rmTime': UI.remTimes.splice(Number(b.dataset.i), 1); return renderSheet();
    case 'saveRem': { const name = $('#rn').value.trim(), T = UI.remType; if (!name) { UI.remErr = 'Give the reminder a name.'; return renderSheet(); } if ((T === 'med' || T === 'custom') && !UI.remTimes.length) { UI.remErr = 'Add at least one time.'; return renderSheet(); }
      const r = {id:uid(), type:T, label:name, on:true}; if (T === 'feed' || T === 'diaper') { r.mode = 'interval'; r.hours = UI.remHours || 3; r.since = now(); } else { r.mode = 'daily'; r.times = UI.remTimes.slice(); if (T === 'med') { r.dose = $('#rd') ? $('#rd').value.trim() : ''; if (UI.remGap) r.minGapH = UI.remGap; } }
      S.reminders.push(r); UI.sheet = null; save(); return render(); }
    case 'delRem': S.reminders = S.reminders.filter(x => x.id !== b.dataset.id); save(); return render();
    case 'medGiven': return tryGive(b.dataset.id, false);
    case 'medForce': return tryGive(b.dataset.id, true);
    case 'enableNotif': try { Notification.requestPermission().then(() => render()).catch(() => render()); } catch (e) { render(); } return;
    case 'toastClose': UI.toasts = UI.toasts.filter(x => x.id !== b.dataset.id); return renderToasts();
    case 'toastSnooze': { const al = UI.toasts.find(x => x.id === b.dataset.id); if (al && al.rid !== 'visit') LOC.snoozes.push({rid:al.rid, at:now() + 10 * MIN}); UI.toasts = UI.toasts.filter(x => x.id !== b.dataset.id); saveLocal(); return renderToasts(); }
    case 'toastLog': { const al = UI.toasts.find(x => x.id === b.dataset.id), r = al && S.reminders.find(x => x.id === al.rid); UI.toasts = UI.toasts.filter(x => x.id !== b.dataset.id);
      if (r && r.type === 'med') { renderToasts(); return tryGive(r.id, false); } UI.tab = r ? ({feed:'feed', diaper:'diaper', sleep:'sleep'})[r.type] || 'rem' : 'rem'; return render(); }
    case 'visit': { const k = b.dataset.k; if (S.visits[k]) delete S.visits[k]; else S.visits[k] = now(); save(); return render(); }
    case 'allVisits': UI.showAllVisits = !UI.showAllVisits; return render();
    /* insights */
    case 'growthAdd': { const w = parseFloat($('#g-w').value), h = parseFloat($('#g-h').value); if (!w && !h) return; S.growth.push({b:cur().id, t:now(), kg:w ? (S.units === 'us' ? w / 2.20462 : w) : null, cm:h ? (S.units === 'us' ? h * 2.54 : h) : null}); save(); return render(); }
    case 'tempSave': { const raw = parseFloat($('#tempIn').value); if (!raw) return snack('Type the reading first.'); const c = S.units === 'us' ? (raw - 32) * 5 / 9 : raw; if (c < 30 || c > 43) return snack('That reading looks off. Check the number and unit.'); addLog({kind:'temp', c:Math.round(c * 10) / 10}); return render(); }
    case 'ci': UI.ci[b.dataset.k] = b.dataset.k === 'worry' ? v : Number(v); return render();
    case 'ciSave': { const c = UI.ci; if (!c.sleep || !c.mood || !c.worry) return snack('Answer all 3 questions first.'); LOC.checkins.push({t:now(), by:LOC.me, sleep:c.sleep, mood:c.mood, worry:c.worry}); if (LOC.checkins.length > 120) LOC.checkins = LOC.checkins.slice(-120); UI.ci = {}; saveLocal(); return render(); }
    /* report */
    case 'report': UI.sheet = {type:'report'}; return renderSheet();
    case 'repCopy': { const txt = reportText(); try { navigator.clipboard.writeText(txt).then(() => snack('Report copied.'), () => { UI.sheet.copyText = txt; renderSheet(); }); } catch (e) { UI.sheet.copyText = txt; renderSheet(); } return; }
    case 'repDownload': return (async () => { try { const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; if (!dl) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([reportDoc()], {type:'text/html'})); a.download = (cur().name || 'baby') + '-7-day-summary.html'; document.body.appendChild(a); a.click(); a.remove(); return; } const html = reportDoc(); try { await dl.save({filename:(cur().name || 'baby') + '-7-day-summary.html', data:new Blob([html], {type:'text/html'})}); } catch (e1) { await dl.save({filename:(cur().name || 'baby') + '-7-day-summary.html', data:html}); } } catch (e) { snack('Download was cancelled or is not available.'); } })();
    case 'repPrint': try { window.print(); } catch (e) { snack('Printing is blocked here. Use Copy as text, or take a screenshot.'); } return;
    /* voice */
    case 'voiceOpen': UI.sheet = {type:'voice'}; UI.voiceMsg = ''; return renderSheet();
    case 'voiceListen': return startListening();
    case 'voiceEx': { const i = $('#voiceIn'); if (i) i.value = v; return act('voiceRun'); }
    case 'voiceRun': { const i = $('#voiceIn'); if (!i || !i.value.trim()) return; UI.voiceMsg = parseCommand(i.value); i.value = ''; return render(); }
    case 'reloadApp': return location.reload();
    case 'resetLocal': try { localStorage.removeItem('nestling-v1'); localStorage.removeItem('nestling-local-v1'); } catch (e) {} return location.reload();
    case 'closeSheet': case 'scrim': UI.sheet = null; return render();
  }
}

/* ================= boot ================= */
function showFatal(e) {
  const r = $('#app'); if (!r) return;
  r.innerHTML = `<div class="wrap"><section class="card" style="margin-top:40px"><h2>Nestling hit a snag</h2><p class="sub" style="margin:6px 0 10px">Try again first. If it keeps happening, start fresh on this device. Your account copy is not deleted.</p><div class="note pk" style="word-break:break-word">${esc((e && e.message) || e)}</div><div class="row" style="margin-top:12px"><button class="btn" data-act="reloadApp" type="button">Try again</button><button class="btn ghost" data-act="resetLocal" type="button">Start fresh on this device</button></div></section></div>`;
}
window.addEventListener('error', ev => { if (document.querySelector('#app .empty')) showFatal(ev.error || ev.message); });
window.addEventListener('unhandledrejection', ev => { if (document.querySelector('#app .empty')) showFatal(ev.reason); });
function startLoops() {
  /* battery friendly: labels refresh every 30 s, every 1 s only while a breastfeed timer runs, never while hidden */
  (function loop() { try { if (!document.hidden) { tick(); applyTheme(); } } catch (e) {} setTimeout(loop, cur() && cur().breastActive ? 1000 : 30000); })();
  setInterval(() => { try { checkReminders(); } catch (e) {} }, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { try { checkReminders(); if (!UI.sheet && !UI.draft) render(); } catch (e) {} } });
}
(function boot() {
  try { loadLocal(); applyTheme(); render(); checkReminders(); } catch (e) { showFatal(e); }
  startLoops();
  initStore().then(() => { try { softRender(); } catch (e) { showFatal(e); } }).catch(() => {});
})();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
